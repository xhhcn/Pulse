worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not advertise the nginx version on error pages and in Server headers.
    server_tokens off;

    # Log the path without query parameters so SSE/admin/share tokens are not
    # persisted in access logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    server {
        listen 8008;
        server_name _;

        # 禁用绝对重定向，避免反代时端口问题
        absolute_redirect off;

        # The backend caps every request body at 1 MB; match it here so an
        # oversized upload is refused at the edge.
        client_max_body_size 1m;

        # Frontend static files
        root /usr/share/nginx/html;
        index index.html;

        # SSE (Server-Sent Events) endpoint - needs special handling.
        # "^~" keeps the API prefixes ahead of the regex asset location below,
        # so an API path that happens to end in ".svg" or ".png" still reaches
        # the backend.
        location ^~ /api/events {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            
            # Critical for SSE
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # Long timeout for SSE connections
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # Disable request buffering
            proxy_request_buffering off;
            
            # Pass through X-Accel-Buffering header from backend
            proxy_pass_header X-Accel-Buffering;

            # CORS and hardening headers come from the backend; adding them
            # here as well produced duplicate Access-Control-Allow-Origin
            # headers, which browsers treat as a CORS failure.
        }

        # API proxy to backend
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # For SSE (Server-Sent Events)
            proxy_buffering off;
            proxy_cache off;
        }

        # Health check endpoint
        location ^~ /healthz {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
        }

        # Cache hashed bundle assets — these filenames change on every build,
        # so an immutable 1-year CDN/browser cache is safe.
        location ^~ /_astro/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Non-fingerprinted static files can change without a URL change, so
        # keep browser TTL short while still allowing CDN edge reuse.
        location = /favicon.svg {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        location = /robots.txt {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, s-maxage=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Future non-hashed assets should not be cached as aggressively as
        # /_astro bundles.
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=86400, s-maxage=604800" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # SPA fallback - serve index.html for all non-file routes
        location / {
            try_files $uri $uri/ /index.html;
            # HTML entrypoints must always revalidate, otherwise the browser
            # happily serves stale HTML after a deploy and users never see the
            # new bundle filenames. ETag + no-cache gives cheap 304s while
            # preserving correctness.
            add_header Cache-Control "no-cache, must-revalidate" always;
            # The same hardening headers the Go server sends in standalone
            # mode; nginx add_header does not inherit across locations, so
            # they are repeated in every static location.
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
