name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} follows a review of the server, the agent data and the web frontend. It brings:

            - a login limit that holds against concurrent guesses
            - a third of the disk writes
            - open charts that read only new probes
            - a lighter live list
            - background tabs that pause the live stream
            - Beszel's keys in the view menu
            - an SVG logo as the browser tab's icon

            Existing clients and databases stay compatible; agents need no update.

            ### Highlights

            - Security: the login limit (five wrong passwords, then fifteen minutes locked) counted an attempt only after checking it, so wrong passwords sent at the same moment were all checked (40 of 40 in a test). Each attempt now takes its place before the check.
            - Server: agent pushes that arrive within 100 ms share one database commit. With 131 agents, disk writes fell from 0.76 MB/s (about 65 GB a day) to 0.26 MB/s. A push is still answered only after it is on disk.
            - Server: GET /api/tcping/history takes `since` (unix ms) and reads only from that moment on. Requests that miss the cache for the same history at the same time share one read.
            - Server: the live stream now sends percentages with 2 decimals, speeds with 4 significant digits and latencies to the microsecond. They went out with 17 digits; this is a fifth to a third less compressed data. Stored values are unchanged.
            - Server: resource history no longer lets a report that finishes after its minute was written replace that minute's average. Minutes not yet written are saved at shutdown. Its pages are filled, about half the size on disk.
            - Web: the usage bars are scaled instead of resized, and only a step of five points or more glides (150 ms). Smaller steps, a few pixels, are set at once. On xhh.li's data at 20 servers a page, main-thread work on a live list fell by about two thirds on desktop (1.35 → 0.46 s a minute) and by two fifths on a phone emulated at a quarter speed (4.5 → 2.7 s).
            - Web: an open TCPing chart adds new probes from a `since` read instead of downloading the whole day every minute (about 1 KB instead of 45 KB compressed).
            - Web: a page hidden for a minute closes its live stream and reopens it as soon as it is shown again. Before, every open page received about 27 MB an hour with 130 servers.
            - Web: closed server details no longer keep their charts' data in memory (opening and closing 20 servers left 11 MB behind).
            - Web: a list sorted by a live column moves only the rows that changed place on each update; it used to move every row.
            - Web: the view menu works with the keyboard as Beszel's does:
              - Enter or ↓ opens it on its first item;
              - the arrow keys, Home and End move between items;
              - Escape and Tab close it back on its button.
            - Web: a logo given as SVG code is also the browser tab's icon; an image logo already was.

            ### Compatibility

            - Server changes are shared with Pulse-Hotaru.
            - Existing clients continue to work.
            - The new web app also works with an older server, which answers `since` with the whole day.

            ### Verified

            - Go, with the race detector: concurrent login guesses, batched pushes, `since` reads (privacy mode, unknown servers, unconfigured targets), shared history reads, late resource reports and the shutdown flush. go vet and staticcheck are clean.
            - Disk writes measured on a 131-server QA server before and after.
            - Chromium, Firefox and WebKit:
              - the view menu's keys;
              - the bars' length and easing, with a pixel comparison against v1.3.65 on frozen data (only the end pixel of a bar is now anti-aliased), and small steps set at once;
              - rows moved when sorting;
              - `since` reads of open charts;
              - tab icons;
              - rounded stream values;
              - the regression suites.
            - Chromium: memory after opening 20 servers, and the paused stream of a hidden page.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
