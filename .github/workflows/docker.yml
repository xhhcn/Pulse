name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} finishes the Beszel alignment, measured against a running Beszel 0.21.1 down to phone width: an opened row's details read like Beszel's info bar, flags and OS logos sit at the size of the icons around them, the page takes Beszel's width and margins (on phones too), and the card layout reaches phones — picked by each visitor or made the phones' default in 自定义设置. A reload now starts unfiltered. Existing clients and databases stay compatible; agents need no update.

            ### Highlights

            - Web: an opened row's details follow Beszel's info bar: a 16 px hairline 12 px from the items on either side that never starts a line (a wrapped line used to begin with one), wrapped lines 10 px apart, and down / up traffic as one pair without a rule between them; from 1280 px Beszel's 14 px text with 16 px icons, 13 px below; on phones the icon, label and value line up in columns at 12 px (10 px before), and the TCPing card's average and loss read at 12 px.
            - Web: flags 20 px wide and OS logos 18 px (24 and 20 px before), 18 and 16 px beside the 12 px text of the 1024–1279 px table — the size of the 16 px icons around them. They keep their colours (Beszel shows a plain glyph for four OS families, on a server's own page only); on the dark theme CentOS's and Fedora's darkest colours now take lighter tints, as Debian's and Apple's already did.
            - Web: Beszel's page frame: content up to 1568 px (its default 1600 px layout less its 16 px padding; 1500 px before) with 16 px page margins at every width; on phones its 12 px card padding, the title block inset 8 px and 12 px above the list (8 px margins and padding before); the filter full width below 768 px; the view menu a 192 px column of 288 px that scrolls below 768 px, its four parts side by side from there. English meter words on phone rows give way to their icons under 410 px (Chinese under 360 px).
            - Web: the navigation bar's buttons are Beszel's 40 px squares side by side with 19.2 px icons (21.6 px for "follow the system"), the theme icon turns in as Beszel's does, and the bar is 64 px from 768 px. The navigation buttons and the column headers that sort the table show Beszel's focus ring for keyboard users (the headers had none).
            - Web: the card layout on phones. The view menu's layout applies at every width: on phones Table keeps Pulse's compact rows and Cards shows Beszel's cards, one a row (two from 640 px). New switch in 自定义设置: 手机端卡片布局 / Card Layout on Phones (off by default) makes cards the default under 768 px for visitors who have not picked a layout.
            - Web: a reload starts unfiltered: the status filter (全部 / 在线 / 离线) is no longer kept in the browser — a page reloaded on 离线 kept hiding the other services — and the filter field starts empty. The sort, layout and shown fields are still kept.
            - Server: the public navbar config carries `phone_cards`.

            ### Compatibility

            - Existing clients continue to work; no wire format changed for agents.
            - Existing `metrics.db` files remain readable; the new `phone_cards` setting is off until set.
            - A layout picked in the view menu (kept in the browser) now also applies under 768 px; a status filter kept by an earlier version is dropped on the first load.

            ### Verified

            - Against a running Beszel 0.21.1 fed with the same 131 servers: the page frame (navigation bar, card, title, description, filter, view button and list) at 390, 700, 1100 and 1440 px, the phone view menu, the info bar's dividers and spacing, and the theme button's icons and motion.
            - Chromium, Firefox and WebKit: the table at 153 widths from 768 to 1920 px in both languages and every column sorted from 768 to 1440 px; phone rows and cards every 3 px from 320 to 767 px in both languages (no sideways scroll, no value under its label, flag and OS clear of the name); the layout on phones, the phone-card switch and a visitor's own choice across reloads; the toolbar, the menu and a reload starting unfiltered; sorted tables during a minute of live updates; the chart following a theme switch frame by frame; the TCPing chart's selection, tooltip and live samples; the sticky header; the admin dialogs; the glass dialogs; the connection notice; a theme audit of 60 pages (no new findings; the missing focus rings it listed are gone).
            - Server tests: `phone_cards` is served to visitors like `sticky_header`, never with the shared secret.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
