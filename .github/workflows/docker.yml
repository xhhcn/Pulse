name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} follows a design review of the charts and the interface. The latency legend names the routes that lose probes, a selected target gets its own latency axis, and the network chart draws upload below the zero line. Windows contrast themes, screen readers and touch screens are better served.

            ### Server details: the TCPing chart

            - The legend names a target's loss where it counts, with the loss band on or off.
              - A target that lost 1 % or more of its probes in the span, and at least two of them, shows its loss in red: 「CT 993 ms · 丢包 96.8%」.
              - A target that lost every probe shows 「丢包 100%」. It used to show its name alone.
              - Smaller losses stay on the loss band, in the readout and in the 延迟 view. A selected target shows any loss.
              - With 10 targets the legend stays on one line at 1440 px. On a phone it grows only by the targets in trouble.
            - Selecting a target fits the latency axis to its line, for example 160–240 ms instead of 0–1250 ms when another target answers near 1 s. The other targets stay faded behind it.
            - The readout keeps the legend's order while the pointer moves. It used to be sorted by value, so rows changed places at almost every probe. Its keys are now short lines.
            - The readout follows the pointer between probes. On the 1-hour span it used to drop out between them. In a stretch without samples, no dots light up any more.
            - Colours from the 4th target on stay apart for red-green colour-blind readers; the 4th used to look like the 1st's blue to them. The first three are unchanged.
            - With reduced motion asked for, the chart doesn't animate.

            ### Server details: 资源

            - The network chart draws upload below the zero line. Download and upload of similar size used to knot into one band, with their fills mixed into a third colour. The axis is labelled without signs.

            ### Windows contrast themes

            - Focus shows as an outline on every control; 26 of 49 used to show none.
            - The usage bars, status dots, legend keys and readout keys keep their colours.
            - The chosen tab, the pressed offline filter and the switches are outlined.
            - The chart's text, grid and cursor take the theme's colours.

            ### Phones

            - A tap just right of a server's name opens the row. An invisible copy-link button used to take it. The opened row shows the button, with a 24 px target.
            - Tags in the details are 12 px instead of 10 px.

            ### Sign-in and admin

            - Sign-in errors stay until you type again. They used to vanish after 5 s, the setup-code note included. Screen readers announce them, and the field concerned is marked.
            - Switches that are off are easier to see: a darker track and a shadowed knob.
            - The 设置 menu has the view menu's size and hover.
            - Dialogs:
              - the close buttons have a 16 px cross;
              - the privacy dialog's rows match the other dialogs;
              - the edit dialog's switch rows match the settings dialog's.
            - Smaller fixes:
              - copy buttons are read out by their Chinese names in the Chinese interface;
              - required marks are darker and not read out;
              - the sign-in button's focus ring meets 3:1.

            ### Also

            - Screen readers hear how the table is sorted: 「CPU，降序」.
            - Page buttons and unselected tabs react to the pointer. Menus, close buttons and copy buttons hover in the same warm accent.
            - 延迟 view: an offline server's last figures are readable at 7:1 contrast, up from 2.6:1.

            ### Compatibility

            - No server or agent code changes; agents stay at 1.3.68. Pulse-Hotaru is not affected.

            ### Verified

            - Chromium, Firefox and WebKit:
              - each change;
              - the legend with 3, 5 and 10 targets, 360–1440 px;
              - contrast-theme emulation;
              - the regression suites.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
