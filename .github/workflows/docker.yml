name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} brings the dashboard close to Beszel, the design Pulse follows, measured element by element against a running Beszel 0.21.1: its typeface, colours, proportions, bars, menus, tooltips and chart style, a card layout, sortable and hideable columns, a theme button that can follow the system, and a glass mode built on the same theme. What Pulse shows stays as it was. Existing clients and databases stay compatible; agents need no update.

            ### Highlights

            - Web: Beszel's look, matched to a running instance: Inter (self-hosted, SIL Open Font License) for Latin text, its warm (light) and cool (dark) greys, page, card, border and muted text tones in both themes, its radii, a 64 px navigation bar (56 px on phones) with 40 px buttons, 1500 px content width, and its status colours (Pulse keeps its yellow, orange and red steps at 70, 80 and 90 %).
            - Web: from 1280 px the table is Beszel's: 14 px text, 56 px rows, an 8 px status dot, 14 px bars that fill their column, values in its regular weight with tabular figures, and a 48 px header whose names sort the table; the sort arrow takes the place of a column's icon under the pointer or once sorted, so no column changes width. Flags and OS logos are a size smaller and the OS logos line up under their header.
            - Web: the filter is Beszel's plain field with a clear button (Ctrl K / ⌘K or / still go to it), next to the view button. The view menu has Beszel's four parts: layout (table, or cards from 768 px), status (all, online, offline, with counts), sort by any column and the fields shown; the choices are kept in the browser.
            - Web: the card layout is Beszel's: a shaded header with the status dot, name, flag and OS over aligned rows of icon, label and value, two cards a row, three from 1024 px. An opened card stays in place: its details open across the grid under its row while the next cards fill the row.
            - Web: the TCPing chart keeps every probe, as before, drawn in the style of Beszel's charts: 1.5 px lines, the axis fitted to them, a time every 2 hours with Beszel's tick marks, its grid and text colours, a dot on the probes under the pointer, and the legend under the chart. A legend entry picks its target and the others fade in their own colours; the tooltip lists the targets from the highest.
            - Web: on a theme switch the chart changes colour in the same frame as the page (before, a moment early, under the old page's cross-fade); in dark, an opened row sits a step below the card and its chart a step above.
            - Web: the theme button steps through light, dark and "follow the system", the default; with it chosen, the dashboard, admin and login pages follow the system as it changes. Icons follow Beszel's (uptime, network, the dark theme's moon).
            - Web: glass mode is Beszel's theme in frosted glass: a warm paper (light) or graphite (dark) ground lit by soft fields of Beszel's chart colours, lighter panes with a hairline edge, Beszel's header band as a tint, and one frosted material for menus, dialogs, tooltips, the chart's tooltip and notices.
            - Web: icon-only buttons show Beszel's tooltip on hover and keyboard focus; an opened row lists its details with icons; the login page has the mark, fields with an icon and a dark primary button; admin has Beszel's title, neutral 40 px icon buttons, its dialog titles, one primary style (red for deleting and for a new shared secret), matching switches and notices.
            - Web: fixes. A row ignored changes under 0.1 (under 0.1 MB/s for speeds) for good, so an idle server could keep showing an old speed and a sorted table could look out of order; rows were not reordered when services were added, removed or filtered in the same update; on phones under 390 px a card's memory value dropped below its label.

            ### Compatibility

            - Existing clients continue to work; no wire format changed.
            - Existing `metrics.db` files remain readable.
            - A light or dark choice made before stays; without one, the page follows the system as it did on load, now also while open.

            ### Verified

            - Against a running Beszel 0.21.1 fed with the same 131 servers: computed sizes, colours, borders and radii of the navigation bar, toolbar, table, cards, menus, tooltips and charts in both themes, from 390 to 1440 px.
            - Chromium, Firefox and WebKit: the table at 153 widths from 768 to 1920 px in both languages and every column sorted from 768 to 1440 px; the phone cards from 320 to 767 px; hidden fields, the card layout and an opened card; the toolbar, menu and kept choices; sorted tables during a minute of live updates; the chart following a theme switch frame by frame; the TCPing chart's selection, tooltip and live samples; the sticky header; the admin dialogs; the glass dialogs; the connection notice; a theme audit of 60 pages.
            - The TCPing palette with the dataviz validator: the first three colours separate under protanopia and deuteranopia as any pair (ΔE 13.8 or more) and keep 3:1 on both chart cards.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
