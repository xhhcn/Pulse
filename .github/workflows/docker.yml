name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} follows a review of the server, the web app and the agent (now 1.3.68). It closes security holes, keeps the server honest when its disk fills or its clock steps, and smooths the resource charts.

            ### Security

            - Web: an SVG logo or icon could run script. The sanitizer compared tag names with their prefix, so `<s:script>` (an SVG or XHTML namespace prefix) was kept; it ran in Chromium and WebKit, and on /admin it could read the session. Elements are now judged by namespace and local name, and `url(…)` to other sites is dropped. Shipped icons and logos come out unchanged (213 of 213).
            - Server: a damaged database (both meta pages bad, or a truncated restore) was replaced by an empty one with the first-run setup open, so the first visitor could set the admin password. The setup now stays locked until it is done from the server itself; the log says how.
            - Server: the login limit counted each IPv6 /64 on its own, so one /48 could buy 327,680 password checks per 15 minutes, more CPU than the server has.
              - A /48 now also has a budget: 20 failures per 15 minutes.
              - At most 2 checks run at once. A login that finds both busy is asked to retry; it is not counted.
            - Server and web: the admin page (and a private dashboard viewed with the session) opened the live stream with the 24-hour session in its URL, which proxies and CDNs log. It now trades the session for a single-use ticket that is valid for 30 s.
            - Server and agent: a newly registered agent could be polled over plain HTTP before its first push, with its secret in the request (seen in 2 of 2 starts). The server now waits 20 s before polling a new registration, and agent 1.3.68 pushes before it registers.
            - Server: an unknown server ID and a wrong secret get the same answer, so the IDs that exist are not revealed. Error responses no longer carry internal error text.
            - Agent 1.3.68:
              - pushes and registrations follow no redirect to another host (their body carries the secret);
              - child processes no longer inherit SECRET.

            ### Robustness

            - Server: when the disk is full, every server used to stay online with frozen numbers, and nothing said so. Now:
              - a push counts only once it is stored;
              - a failed save is logged;
              - /healthz answers 503 while pushes cannot be stored.
            - Server: a step of the server's own clock (an NTP fix) no longer drops TCPing samples for two minutes. The agent clock estimates measure ages on the monotonic clock.
            - Server: changing the shared secret writes the config and every system's secret in one transaction, touching only the secret. It was one commit per system, which could stop halfway and could undo edits made meanwhile.
            - Server: a viewer that stops reading is dropped within about a minute. It used to hold its stream and kernel memory for 8 minutes or more.
            - Server: the TCPing history cache keeps only the gzip copy, so every server's history fits. A client asking for each server in turn no longer makes each request a database read (about 40 ms of CPU each).
            - Web: a stream that connects and then drops is retried with a growing pause, and the connection notice shows. It used to reconnect about once a second without a notice.
            - Agent 1.3.68:
              - after a failed push the next one waits 6, 12, then 24 s; it used to retry every 3 s, each time with the whole backlog;
              - after a rejection (unknown ID, wrong secret) it pushes once a minute and says why in its log.

            ### Design

            - The resource charts average as Beszel's do, about 72 points a chart:
              - 24 h: 20-minute averages;
              - 12 h: 10-minute averages;
              - 6 h: 5-minute averages;
              - 1 h: every minute.

              The line under the tabs says which. A day used to be 1,440 minutes packed two to a pixel, and one minute's spike flattened the rest of the network chart.

            ### Performance

            - Agent 1.3.68 uses HTTP/2 where the server's CDN speaks it (Cloudflare does): 40 % fewer bytes per push.
            - Web: a language switch translates the page once; it ran twice. Opening a row no longer runs a page-wide translation.

            ### Windows

            - Agent 1.3.68: one unreadable drive (a locked BitLocker volume, a dead share) no longer zeroes the disk total, and only the machine's own fixed disks count (no network drives, USB sticks or ISOs).

            ### Compatibility

            - Agent 1.3.68 works with every v1.3 server, and every agent works with this server. Agents installed with auto-update move to 1.3.68 within a day.
            - The server changes and the sanitizer fix are shared with Pulse-Hotaru. Hotaru's pages keep opening the stream with `admin_token`, which still works.

            ### Verified

            - Go, with the race detector:
              - the locked setup after a damaged database (forwarded headers do not count as local);
              - the /48 login budget and the 2-check limit;
              - the shared-secret transaction;
              - pushes counted only once stored, and /healthz;
              - stream tickets (single use, 30 s, admin view only with a valid session);
              - one answer for an unknown ID and a bad secret;
              - gzip-only cache entries served byte-identical;
              - agent clocks across server clock steps (−10 min to +1 h);
              - the agent's push outcomes, backoff and logs;
              - the Windows drive totals.
            - Containers:
              - a packet capture of agent start-up: the secret on the wire with v1.3.68 and agent 1.3.67 (2 of 2 starts), not with this server (agent 1.3.67) nor with agent 1.3.68;
              - the agent against a server answering 503, hanging, 401 and 404;
              - 50 stalled viewers: dropped within 90 s (v1.3.68: still open after 3 minutes);
              - the new agent against the new server.
            - The sanitizer: 11 crafted SVGs in Chromium, Firefox and WebKit (6, 4 and 7 unsafe before, 0 after), and every shipped icon.
            - Chromium, Firefox and WebKit:
              - the stream tickets on the admin page and a private dashboard;
              - the connect-and-drop stream;
              - the resource chart averages;
              - the login messages;
              - the logo on /, /login and /admin;
              - a language switch;
              - the regression suites.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
