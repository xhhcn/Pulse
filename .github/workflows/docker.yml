name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} fixes reordering on the admin page, makes the admin's card layout show for every visitor, stops the details from repeating what the row already shows, and makes share links work the moment they are generated. Existing clients and databases stay compatible; agents need no update.

            ### Highlights

            - Admin: dragging a server carries it any number of places up or down (it stopped after one place up). Keyboard ↑/↓ keeps the focus on the moved row.
            - Web: the view menu's layout, fields and sort last for the visit, and every load starts from the site's settings, so 自定义设置 → 卡片布局 shows for every visitor. Choices kept by earlier versions are cleared.
            - Web: the details no longer repeat the location and OS that the flag and logo (phones, cards) or the table's columns already show; they still appear where the table has no such columns.
            - Admin: 生成分享链接 saves the link at once, so a copied link works even if the dialog is closed with 取消; 立即停止分享链接 appears only when there is a link.
            - Privacy mode: visitors who reach the login page are told the dashboard is private, and an ended share link says so; the site logo keeps a share link's token. The privacy dialog's description is corrected.
            - Login: after five wrong passwords the form says the login is locked for 15 minutes; the heading follows a language switch on every form.
            - Web: the filter also searches tags; in glass mode only the picked legend entry is highlighted; live updates do less layout work with many servers; leaving the admin page no longer throws an error.

            ### Compatibility

            - Existing clients continue to work; no wire format or server change.

            ### Verified

            - Chromium, Firefox and WebKit: reordering by mouse (several places, with turns on the way) and keyboard, and by touch in Chromium; the view settings across reloads with the card layout on and off and over choices an older version kept; the details at phone, card, 800, 900 and 1440 px and with a hidden field; generating, cancelling, reopening and stopping a share link; the login headings in both languages and on the first-run form; the lockout message; the privacy redirects; tag search; the glass legend; name-column widths identical to v1.3.53; with every earlier suite.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
