name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} brings Pulse's motion in line with Beszel's restraint while keeping Pulse's heartbeat — now a live signal — makes the default layout one switch for every screen, and stops an opened row from repeating what the row above it already shows. Existing clients and databases stay compatible; agents need no update.

            ### Highlights

            - Web: the navbar logo no longer pulses forever: it beats once each time fresh data reaches the page and stays still when the live stream stops, so the motion itself says the page is live (Beszel keeps its logo still; its one looping motion is a status ping that means "up"). No beat in a background tab, with reduced motion or for a custom logo.
            - Web: pages appear at once, as Beszel's do — no sliding navbar, staggered icons, rising content or row-by-row cascade (about a second of entrance before). The navbar's own name and logo, which wait for the site's settings, show in one 150 ms fade, and the first data replaces the loading preview with one 150 ms fade of the list. The login card enters as a dialog does; its fields no longer stagger in. Nothing moves on the way in: the table header keeps its place while the list loads, the footer waits for the list, and the summary chips' line is held (on narrow phones always a line of its own) — no layout shift at any width, where the old entrance only hid two jumps.
            - Web: live data moves calmly: bars ease to a new value in 150 ms (0.5 s on every refresh before), colours change at once, and rows change colour on hover at once, as in Beszel.
            - Web: a new TCPing chart still draws in from left to right — Pulse's one flourish on a chart — in 0.4 s instead of 0.9 s and without rising. Button tooltips, dialogs, the chart tooltip and the sort headers take Beszel's timing (150 ms with an 8 px slide, 200 ms, 150 ms, 50 ms).
            - Web: 自定义设置 has one 卡片布局 / Card Layout switch in place of 电脑端 / 手机端卡片布局: on, visitors get cards on desktops and phones alike; off, the table (compact rows on phones). A layout a visitor picks in the view menu still wins, and resizing the window across 768 px no longer changes the layout.
            - Web: an opened row's details leave out the location and the OS where the row above already shows them, as Beszel's info bar leaves out an item that would repeat what is on screen — the table from 1024 px with a mouse or trackpad. The location cell's tooltip gives the country's full name, and the OS cell's now also the kind of machine (Debian · VPS). Phones and cards (icons only), 768–1023 px (no room for those columns), touch screens (no tooltips) and a column hidden in the view menu keep them in the details.
            - Server: the navbar config's `card_layout` replaces `desktop_cards` and `phone_cards`.

            ### Compatibility

            - Existing clients continue to work; no wire format changed for agents.
            - A config saved by v1.3.49 or v1.3.50 reads as `card_layout` on when either `phone_cards` or `desktop_cards` was on; the next save in 自定义设置 stores `card_layout` alone.
            - With reduced motion set in the system, the logo's beat, the list's fade and the chart's sweep are left out, as the other animations already were.

            ### Verified

            - Chromium, Firefox and WebKit: the motion (no entrance on the home, admin and login pages; no layout shift while the page loads, at nine widths from 320 to 1440 px; the logo still at rest and beating on fresh data, never with reduced motion; bar, row, sort-header, tooltip, dialog and chart timings; the chart's 0.4 s sweep); the card layout switch off and on at phone and desktop widths, across a window resized over 768 px and a visitor's own choice across reloads, and the admin switch saving `card_layout` alone; the details with and without the location and OS items (1440 px table, 900 px, phone rows, cards, a touch screen, a hidden column) and the OS tooltip with the kind of machine; the columns, tooltips, sorting, filtering and an empty status filter; the table at 153 widths from 768 to 1920 px in both languages with every column sorted; phone rows and cards every 3 px from 320 to 767 px; sorted tables during a minute of live updates; the chart following a theme switch frame by frame; the TCPing chart's selection, tooltip and live samples; the sticky header; the admin and glass dialogs; the connection notice; a theme audit of 60 pages (no new findings).
            - Server tests: `card_layout` is served to visitors like `sticky_header`, never with the shared secret; configs saved with the per-screen switches read as one.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
