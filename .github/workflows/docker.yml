name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} redesigns the optional glass appearance and polishes theme switching, keyboard use and the TCPing tooltip. Existing clients and databases stay compatible; agents do not need an update (they report 1.3.34).

            ### Highlights

            - Web: the glass appearance (the "Glassmorphism Effect" switch in the admin settings) is redesigned as a graphite take on the macOS material, so it reads as an extension of the default theme. The page is a graphite wallpaper under a soft studio light instead of violet, pink and blue glows; the navbar, the main cards and the login card are frosted panes with a top highlight, a hairline edge and a soft lift; colour is left to the data. The columns menu and the dialogs blur and saturate what lies beneath them like macOS menus and sheets, and are opaque enough that the table no longer shows through their text.
            - Web: glass mode scrolls as smoothly as the default theme. It used to stack backdrop blurs on every pane and row (330 on the home page), most of which could not even reach the page background, and scrolling took several times as long per frame.
            - Web: switching between light and dark is one cross-fade again. The rule that pauses colour transitions during the switch only covered each page's own markup, so the table, the filter box and the navigation re-coloured in steps for about half a second afterwards (and browsers without View Transitions switched only part of the page at once).
            - Web: the parts the browser draws itself (form controls, autofill, the phone's address bar) follow the theme chosen on the page instead of the system setting.
            - Web: the TCPing tooltip reads "CU: 231.67 ms" instead of "CU (ms): 231.67 ms", and a target that timed out in the hovered minute is listed as "Timeout" instead of being left out.
            - Web: rows can be reached with Tab and opened or closed with Enter or Space; a green ring marks the row with keyboard focus. Mouse and touch behave as before (Space after a click still scrolls the page).
            - Web: when the system asks for reduced motion, rows open and close without sliding and the chart does not wait for a slide.
            - Web (admin): from 1280 px the address column fits a full IPv6 address, so the traffic column lines up on every row; narrower screens are unchanged.
            - Web: the footer tagline follows the interface language.

            ### Compatibility

            - Existing clients continue to work; no wire format changed.
            - Existing `metrics.db` files remain readable; the glass switch keeps its setting.

            ### Verified

            - Chromium, Firefox and WebKit, light and dark, on a copy of a 131-server production dataset: glass mode on the home, admin and login pages and in all eight admin dialogs (only the columns menu and the dialogs blur, the wallpaper renders alike in all three engines, no console errors); a theme switch on every page (one cross-fade with View Transitions, an instant switch without); the browser's colour scheme and theme colour match the shown theme in 18 of 18 combinations of system setting, chosen theme and page; keyboard use (Tab, Enter, Space, aria-expanded, the focus ring; Space after a click still scrolls); reduced motion (rows open in the first frame and the chart does not wait; with normal motion the slide is unchanged); the admin traffic column at one position from 1280 px without touching the CPU logo, and below 1280 px the same layout as v1.3.38.
            - Regression: the 40 functional chart checks; the share-link and admin views of a privacy-mode instance and a deployment without targets; Chart.js unreachable or altered (integrity); a live refresh that only drops expired points. The TCPing chart is pixel-identical to v1.3.38 in 56 combinations of theme, width (390–1440 px), pixel ratio and browser, 10 of them built while the row was still opening.
            - Glass mode scrolls at the frame time of the default theme (17 ms median on the test machine; 68 ms with the previous glass). The server code is unchanged from v1.3.34.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
