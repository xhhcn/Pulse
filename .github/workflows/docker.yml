name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} fixes what three independent reviews of the server, the agent and the pages found, keeps the dashboard table inside its card at every width, and adds an optional sticky table header. Existing clients and databases stay compatible; agents 1.3.45 measure TCPing and traffic more accurately.

            ### Highlights

            - Agent 1.3.45: a TCPing sample is the TCP handshake only. With a host-name target the agent also timed the DNS lookup (tens of milliseconds on a host that asks a public resolver), and a failed lookup counted as packet loss.
            - Agent 1.3.45 (Linux): traffic totals and speeds count the host's own interfaces only. Docker and other bridges, veth/tap ends, tunnels (tun, WireGuard, Tailscale, ZeroTier), Kubernetes overlays and ifb mirrors are skipped: a container's download was counted up to three times, and the totals dropped when a container stopped.
            - Web: the login form never puts the password into the address bar. Pressing Enter before the page script was ready (a slow link) submitted the form natively as a GET, with ?password=… in the URL, the history and access logs. A network error or a 5xx now says the server could not be reached instead of "invalid password".
            - Web: a signed-in admin's dashboard uses the public, compressed stream unless privacy mode needs the session. The admin view carries every server's addresses and secret, is never compressed (about six times the bytes) and put the session token into every stream URL. In privacy mode, a session or share link that ends now sends the page to the login screen instead of leaving it frozen, and a dead share link no longer logs out an admin whose session is still valid.
            - Web: the table no longer cuts off its last column at 768-783 and 1024-1046 px (the Offline chip had widened the name column); a very long name gets an ellipsis instead.
            - Web: filtering and sorting no longer download the whole list on every keystroke; icons no longer hold up row clicks and live updates (the largest flags come from api.iconify.design); the stream reconnects as soon as the network returns or the tab is shown again.
            - Web (admin): settings dialogs cannot be saved before their current values have loaded (a blank form erased the TCPing targets, the custom code and the shared secret, or the share link). Revoke Share Link revokes at once (it only cleared the form). Custom JavaScript with a top-level `const root` no longer stops the admin page. Buttons stay in the page's language after an action, and field labels are tied to their fields.
            - Web: new option Sticky Table Header in the general settings, off by default: the column names stay at the top of the window while a long list scrolls.
            - Web: pages keep working when the browser blocks site data, and the favicon is a static icon (Chrome showed the first, faint frame of its animation).
            - Server: a push whose write failed is stored when the agent sends it again (it was taken for a duplicate and dropped); registration ignores unspecified, loopback and private IPv6 addresses (`::` made the server poll its own loopback); the TCPing interval is capped at 24 h (a huge value crashed the pollers on every start); a push in flight writes no history for a system just deleted; database compaction peaks at about 47 MB of memory instead of 330 MB; login and token checks count an IPv6 /64 as one client.

            ### Compatibility

            - Existing clients continue to work; no wire format changed.
            - Existing `metrics.db` files remain readable; the new `sticky_header` setting is off until it is switched on.

            ### Verified

            - Go: the server and agent suites with the race detector, staticcheck and govulncheck; a new test for each server fix, failing on v1.3.44.
            - Chromium, Firefox and WebKit: the table at 153 widths from 768 to 1920 px in both languages, the sticky header option, the round-10/12/13 checks, the chart functions and gap rule, the share-link and admin views of a privacy-mode instance, the glass pages and dialogs, and a reproduction of every fixed issue.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
