name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.3.26)'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: xhh1128
  IMAGE_NAME: xhh1128/pulse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Determine version
        id: version
        # The dispatch input reaches the script through the environment, never
        # pasted into it, so a crafted tag name cannot run as shell code.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Determined tag: $TAG, version: $VERSION"

      - name: Check if server files exist
        id: check_server_files
        run: |
          if git ls-tree -r --name-only HEAD | grep -qE '^(server/|docker/|Dockerfile)'; then
            echo "server_files_exist=true" >> $GITHUB_OUTPUT
            echo "Server files found"
          else
            echo "server_files_exist=false" >> $GITHUB_OUTPUT
            echo "No server files found, skipping"
          fi

      - name: Set up QEMU
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: actions/setup-go@v5
        with:
          # Client binaries are built with Go 1.26 (macOS 12+); the server
          # image and standalone binaries use Go 1.27 (see Dockerfile and
          # build-server-standalone.yml).
          go-version: '1.26'
          # The newest patch release, not whichever one the runner image has
          # cached: a cached 1.26.9 built agents without the crypto/x509 fix
          # of 1.26.10 (GO-2026-6809).
          check-latest: true

      - name: Build Client Binaries
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        # Build the whole client package (`.`), not `main.go` alone.
        # The client has been split into main.go + hwprobe_*.go/.s +
        # linux_kernel{,_other}.go (selected by GOOS/GOARCH build tags),
        # so single-file builds fail with "undefined: readSysinfo" etc.
        run: |
          cd client
          echo "Building client binaries..."
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o probe-client .
          chmod +x probe-client
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-arm64 .
          chmod +x probe-client-arm64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o probe-client-darwin-amd64 .
          chmod +x probe-client-darwin-amd64
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o probe-client-darwin-arm64 .
          chmod +x probe-client-darwin-arm64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o probe-client.exe .
          echo "Client binaries built successfully"

      - name: Create GitHub Release
        if: steps.check_server_files.outputs.server_files_exist == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            client/probe-client
            client/probe-client-arm64
            client/probe-client-darwin-amd64
            client/probe-client-darwin-arm64
            client/probe-client.exe
            client/install.sh
          body: |
            ## Release v${{ steps.version.outputs.version }}

            v${{ steps.version.outputs.version }} is a server update. Agents whose clocks are off by seconds or minutes no longer misplace their TCPing points: the server estimates each agent's clock offset and corrects its samples by a steady amount. Agents (1.3.67) and the web app are the same as v1.3.67.

            ### Highlights

            - Many hosts run without NTP. On xhh.li, 22 of 128 agents were 6 s to 100 s off, some early, some late.
            - The server used to judge each batch of probes on its own. It moved a batch onto the time it arrived only when its newest sample looked over 2 minutes old or 30 s ahead:
              - inside those lines, an agent kept its error: one 100 s slow drew every point 100 s early;
              - near a line, an agent's points jumped back and forth by two minutes, a doubled point in one minute and none in the next (about 110 a day on one server).
            - The server now estimates each agent's clock offset from its pushes:
              - an observation is the arrival time less the newest sample's stamp, taken only when the push follows the previous one within 10 s and brings a sample newer than any seen;
              - the estimate is the smallest of the last five;
              - an agent between 2 s ahead and 6 s behind keeps its own stamps;
              - any other agent is corrected by its estimate, and the correction stays the same until the estimate moves by more than 2 s.
            - A correction that stays the same maps a re-sent sample onto its first record, so it is not stored twice. An agent re-sends a push whose reply was lost; with batches moved one by one, those could show as doubled points.
            - A clock that is set right is followed within one round (three rounds for steps under 20 s).
            - After a short restart, the server uses each server's last report to treat the first push as fresh, so even that push is placed by an estimate. A new agent, or one back after more than half an hour away, is placed batch by batch as before for its first round.

            ### Compatibility

            - Server only. Agents stay on 1.3.67 and need no update; every agent version works.
            - An agent whose clock is right is unaffected: its samples keep their own stamps.
            - The server change is shared with Pulse-Hotaru.

            ### Verified

            - Go, with the race detector:
              - a simulated day for each of 29 agent clocks, from 6 h behind to 3 h ahead, with lost replies, 5 s and 10 min intervals, a 10 min outage and a 2 s restart: no doubled or missing points and nothing stored twice;
              - every sample lands within 3.3 s of the probe's real start, or keeps its own error (at most 5 s) for agents in sync;
              - the old rule, run on the same days, shows the flips;
              - pushes through the handler for fast, slow and synced clocks, re-sends, and an agent on the old 2-minute line.
            - End to end:
              - nine agents, with clocks from 125 s behind to 31 s ahead, pushed to the built server for 5 minutes, with a restart halfway;
              - the same run against v1.3.67, for comparison;
              - the 1.3.67 agent in sync keeps its own stamps to the millisecond.

            ### 📦 Docker Images
            - `xhh1128/pulse:${{ steps.version.outputs.version }}`
            - `xhh1128/pulse:latest`

            ### 📥 Downloads

            **Client binaries**
            | Platform | File |
            |----------|------|
            | Linux amd64 | `probe-client` |
            | Linux arm64 | `probe-client-arm64` |
            | macOS Intel (amd64) | `probe-client-darwin-amd64` |
            | macOS Apple Silicon (arm64) | `probe-client-darwin-arm64` |
            | Windows amd64 | `probe-client.exe` |
            | Install Script (Linux + macOS) | `install.sh` |

            **Server standalone binaries** (uploaded by the standalone workflow)
            | Platform | File |
            |----------|------|
            | Linux amd64 | `pulse-server-standalone-linux-amd64` |
            | Linux arm64 | `pulse-server-standalone-linux-arm64` |

            **Quick Install (Linux & macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/xhhcn/Pulse/main/client/install.sh | sudo bash -s -- --id YOUR_ID --server http://YOUR_SERVER:8008
            ```

            **One-click migration to a new host:**
            ```bash
            PASSWORD="$OLD_ADMIN_PW" \
              sudo -E ./scripts/migrate.sh --from https://old.example.com
            ```
          draft: false
          prerelease: false
